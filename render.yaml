services:
  - type: web
    name: aurel-watches
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: aurel_watches
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: '0'
