{% extends 'base.html' %}{% block content %}<section class="wrap narrow"><div class="eyebrow">AUREL MEMBERSHIP</div><h1>{% if register %}Crear cuenta{% else %}Bienvenido de nuevo{% endif %}</h1><form method="post" class="panel form"><input type="hidden" name="_csrf" value="{{csrf_token()}}">{% if register %}<label>Nombre completo<input name="name" maxlength="80" required></label>{% endif %}<label>Correo electrónico<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="8" required></label><button class="btn gold wide">{% if register %}REGISTRARME{% else %}INICIAR SESIÓN{% endif %}</button></form><p class="muted">{% if register %}¿Ya tienes cuenta? <a href="{{url_for('login')}}">Inicia sesión</a>{% else %}¿Aún no tienes cuenta? <a href="{{url_for('register')}}">Regístrate</a>{% endif %}</p></section>{% endblock %}
