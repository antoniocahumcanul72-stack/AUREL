{% extends 'base.html' %}{% block content %}<section class="wrap narrow"><div class="eyebrow">ATELIER MANAGEMENT</div><h1>{% if p %}Editar reloj{% else %}Nuevo reloj{% endif %}</h1><form method="post" class="panel form"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label>Nombre<input name="name" value="{{p.name if p else ''}}" required></label><label>Marca<input name="brand" value="{{p.brand if p else ''}}" required></label><label>Categoría<input name="category" value="{{p.category if p else ''}}" placeholder="Automático, Clásico, Deportivo..." required></label><label>Descripción<textarea name="description" rows="4">{{p.description if p else ''}}</textarea></label><label>URL HTTPS de imagen (opcional)<input type="url" name="image" value="{{p.image if p else ''}}"></label><label>Precio MXN<input type="number" name="price" min="1" step="0.01" value="{{p.price if p else ''}}" required></label><label>Existencias<input type="number" name="stock" min="0" value="{{p.stock if p else 0}}" required></label><button class="btn gold wide">GUARDAR RELOJ</button></form></section>{% endblock %}
